 <!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghar 3D · 360° View</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#14130f;color:#f1eee6;font-family:system-ui,sans-serif;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
h1{font-size:20px;margin:2px 0 0}
.sub{margin:0;color:#a9a597;font-size:13px;text-align:center}
#stage{width:100%;max-width:900px;height:min(62vh,640px);position:relative;border-radius:16px;overflow:hidden;touch-action:none;cursor:grab}
#stage canvas{width:100%!important;height:100%!important;display:block}
#label{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(30,40,25,.85);padding:8px 18px;border-radius:20px;font-size:16px;z-index:2}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:900px}
button{flex:1;min-width:90px;padding:11px 10px;border:1px solid #3a372c;border-radius:12px;background:#201e17;color:#f1eee6;font-size:16px}
button.on{background:#fb923c;color:#1a1208;border-color:#fb923c}
.sl{width:100%;max-width:900px;display:grid;grid-template-columns:80px 1fr 60px;gap:8px;align-items:center}
.sl input{width:100%}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:10;padding:10px}
#ov.show{display:flex}
#ov img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>
<body>
<h1>🏠 Ghar 3D · 360° View</h1>
<p class="sub">Drag karke ghar ke charo taraf ghumo</p>
<div id="stage"><div id="label"></div></div>
<div class="row">
 <button id="bl">← Left</button>
 <button id="auto" class="on">Auto ghumao</button>
 <button id="br">Right →</button>
</div>
<div class="row">
 <button id="zo">− Door</button><button id="zi">+ Paas</button>
 <button id="top">↑ Chhat dekho</button>
 <button id="swap">Left ⇄ Right badlo</button>
</div>
<div class="row">
 <button id="corner">Corner photo</button>
 <button id="roofp">Chhat photo</button>
</div>
<div class="sl"><span>Chaudai</span><input id="sw" type="range" min="6" max="14" step="0.1" value="8.8"><b id="vw"></b></div>
<div class="sl"><span>Gehrai</span><input id="sd" type="range" min="6" max="16" step="0.1" value="10.2"><b id="vd"></b></div>
<div class="sl"><span>Unchai</span><input id="sh" type="range" min="3" max="9" step="0.1" value="5.6"><b id="vh"></b></div>
<div id="ov"><img id="ovimg" alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const st=$('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){st.textContent='WebGL support nahi hai';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
st.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const SKY=0xa9c8ea;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,45,120);
const camera=new THREE.PerspectiveCamera(40,1,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(10,20,12);scene.add(sun);

// ---- walls (photos) ----
const loader=new THREE.TextureLoader();
const tex=n=>{const t=loader.load('tex_'+n+'.jpg');t.encoding=THREE.sRGBEncoding;return new THREE.MeshBasicMaterial({map:t});};
const M={front:tex('front'),rear:tex('rear'),left:tex('left'),right:tex('right')};
const plain=c=>new THREE.MeshBasicMaterial({color:c});
const rt=loader.load('roof_top.jpg');rt.encoding=THREE.sRGBEncoding;
const roofMat=new THREE.MeshBasicMaterial({map:rt});
let swapped=false;
// BoxGeometry face order: +x, -x, +y, -y, +z, -z
const house=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),
 [M.right,M.left,roofMat,plain(0x888888),M.front,M.rear]);
scene.add(house);

const ground=new THREE.Mesh(new THREE.CircleGeometry(150,48),new THREE.MeshBasicMaterial({color:0x9bc080}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;scene.add(ground);
const pad=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0xdcdad6}));
pad.rotation.x=-Math.PI/2;pad.position.y=-0.01;scene.add(pad);

// ---- chhat ki boundary (safed parapet) ----
const roofG=new THREE.Group();scene.add(roofG);
const L=c=>new THREE.MeshLambertMaterial({color:c});
function box(sx,sy,sz,x,y,z,m){const b=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);b.position.set(x,y,z);roofG.add(b);}
function buildRoof(){
 while(roofG.children.length){const c=roofG.children[0];roofG.remove(c);c.geometry.dispose();}
 roofG.position.set(0,h,0);
 const grey=L(0x4a4a50),cream=L(0xf0ece4);
 // neeche ka dark kinara (slab ka overhang)
 box(w+0.3,0.2,d+0.3,0,-0.12,0,grey);
 const t=0.2,ph=0.6,y=ph/2;
 // FRONT ki deewar hata di gayi hai - sirf PEECHE + dono SIDE
 box(w,ph,t,0,y,-(d/2-t/2),cream);
 box(t,ph,d,w/2-t/2,y,0,cream);
 box(t,ph,d,-(w/2-t/2),y,0,cream);
 // grey cap: peeche + dono side
 box(w+0.1,0.07,t+0.1,0,ph+0.03,-(d/2-t/2),grey);
 box(t+0.1,0.07,d,w/2-t/2,ph+0.03,0,grey);
 box(t+0.1,0.07,d,-(w/2-t/2),ph+0.03,0,grey);
}

// ---- state ----
let w=8.8,d=10.2,h=5.6,az=0,el=0.22,elT=0.22,dist=22,auto=true,drag=false,vel=0,lx=0;
function build(){
 house.scale.set(w,h,d);house.position.set(0,h/2,0);
 pad.scale.set(w+6,d+6,1);
 buildRoof();
}
function setMats(){
 house.material[0]=swapped?M.left:M.right;
 house.material[1]=swapped?M.right:M.left;
}
function resize(){
 const W=st.clientWidth,H=st.clientHeight;
 renderer.setSize(W,H,false);
 camera.aspect=W/H;camera.updateProjectionMatrix();
}
function place(){
 el+=(elT-el)*0.08;
 const r=dist;
 camera.position.set(Math.sin(az)*r*Math.cos(el),h*0.55+Math.sin(el)*r,Math.cos(az)*r*Math.cos(el));
 camera.lookAt(0,h*0.55,0);
 const idx=((Math.round(az/(Math.PI/2))%4)+4)%4;
 $('label').textContent=['Saamne (Front)','Side 1','Peeche (Back)','Side 2'][idx];
}
function loop(){
 requestAnimationFrame(loop);
 if(!drag){
  if(auto)az+=0.004;
  else{az+=vel;vel*=0.92;}
 }
 place();renderer.render(scene,camera);
}
st.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;vel=0;st.style.cursor='grabbing';});
st.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx;lx=e.clientX;az-=dx*0.01;vel=-dx*0.01;if(auto)stop();});
const end=()=>{drag=false;st.style.cursor='grab';};
st.addEventListener('pointerup',end);st.addEventListener('pointerleave',end);
st.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(45,Math.max(12,dist+e.deltaY*0.02));},{passive:false});
function stop(){auto=false;$('auto').classList.remove('on');}
function snap(k){stop();az=Math.round(az/(Math.PI/2))*(Math.PI/2)+k*Math.PI/2;vel=0;}
$('bl').onclick=()=>snap(1);$('br').onclick=()=>snap(-1);
$('auto').onclick=()=>{auto=!auto;$('auto').classList.toggle('on',auto);};
$('zi').onclick=()=>dist=Math.max(12,dist-3);
$('zo').onclick=()=>dist=Math.min(45,dist+3);
$('swap').onclick=()=>{swapped=!swapped;setMats();};
$('top').onclick=()=>{const up=elT<0.5;elT=up?1.3:0.22;$('top').classList.toggle('on',up);};
const show=src=>{$('ovimg').src=src;$('ov').classList.add('show');};
$('corner').onclick=()=>show('corner.jpg');
$('roofp').onclick=()=>show('roof_top.jpg');
$('ov').onclick=()=>$('ov').classList.remove('show');
[['sw','vw',v=>w=v],['sd','vd',v=>d=v],['sh','vh',v=>h=v]].forEach(([i,o,f])=>{
 const inp=$(i),out=$(o);
 const upd=()=>{const v=parseFloat(inp.value);f(v);out.textContent=v.toFixed(1)+'m';build();};
 inp.oninput=upd;upd();
});
addEventListener('resize',resize);
build();setMats();resize();loop();
</script>
</body>
</html>
